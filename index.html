<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diboh MovieBlast — Premium Public Domain Movies</title>
<meta name="description" content="Download and stream verified public domain movies legally.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <div class="nav-top">
      <a href="index.html" class="logo">Diboh<span>MovieBlast</span></a>
      <div class="nav-controls">
        <div class="nav-search"><input id="searchInput" type="search" placeholder="Search movies..." data-translate-ph="search_ph"></div>
        <select id="langSwitcher" onchange="changeLanguage(this.value)">
          <option value="en">English</option>
          <option value="bn">বাংলা</option>
        </select>
      </div>
    </div>
    <nav class="main-nav">
      <a href="index.html" data-translate="nav_home">Home</a>
      <a href="#trending" data-translate="nav_trending">Trending</a>
      <a href="#latest" data-translate="nav_latest">Latest</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="hero-backdrop" id="hero-backdrop"></div>
    <div class="hero-content" id="hero-content"></div>
  </section>

  <div class="filter-section">
    <select id="genreFilter">
      <option value="" data-translate="all_genres">All Genres</option>
    </select>
    <select id="langFilter">
      <option value="" data-translate="all_langs">All Languages</option>
    </select>
    <select id="sortFilter">
      <option value="latest" data-translate="sort_latest">Latest</option>
      <option value="popular" data-translate="sort_popular">Popular</option>
      <option value="rating" data-translate="sort_rating">Rating</option>
    </select>
  </div>

  <section class="section hidden" id="searchResultsSection">
    <h2 class="section-title" data-translate="search_results">Search Results</h2>
    <div id="searchGrid" class="movie-grid"></div>
    <div id="noResults" class="empty-state hidden"><h2 data-translate="no_movies">No movies found</h2></div>
  </section>

  <div id="defaultSections">
    <section class="section" id="trending">
      <h2 class="section-title" id="title_trending" data-translate="trending_title">Trending Movies</h2>
      <div id="trendingGrid" class="movie-grid"></div>
    </section>
    <section class="section" id="latest">
      <h2 class="section-title" id="title_latest" data-translate="latest_title">Latest Added</h2>
      <div id="latestGrid" class="movie-grid"></div>
    </section>
    <section class="section" id="popular">
      <h2 class="section-title" id="title_popular" data-translate="popular_title">Most Popular</h2>
      <div id="popularGrid" class="movie-grid"></div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-links">
    <a href="privacy.html" data-translate="privacy">Privacy Policy</a>
    <a href="terms.html" data-translate="terms">Terms of Use</a>
    <a href="copyright.html" data-translate="copyright">Copyright Policy</a>
  </div>
  <p data-translate="footer_text">© 2025 Diboh MovieBlast | Only legal public domain content.</p>
</footer>

<div class="modal hidden" id="modal">
  <div class="modal-content">
    <button class="close-btn" id="closeModal">✕</button>
    <div class="modal-body">
      <img id="modal-img" src="" alt="Poster" onerror="this.src='https://placehold.co/300x450/13131c/f5b301?text=No+Image'">
      <div class="modal-info">
        <h2 id="modal-title"></h2>
        <div class="meta-tags">
          <span id="modal-year"></span>
          <span id="modal-runtime"></span>
          <span id="modal-rating"></span>
        </div>
        <p id="modal-desc" class="synopsis"></p>
        <p class="cast"><strong data-translate="cast_label">Cast:</strong> <span id="modal-cast"></span></p>
        <div class="rights-box">
          <p><strong data-translate="source_label">Source:</strong> <span id="modal-source"></span></p>
          <p><strong data-translate="rights_label">Rights:</strong> <span id="modal-rights"></span></p>
          <p class="small-text"><em id="modal-evidence"></em></p>
        </div>
        <h3 class="download-title" data-translate="download_title">⬇️ Download Options</h3>
        <div class="download-buttons" id="modal-downloads"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
