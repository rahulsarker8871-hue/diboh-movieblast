<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diboh MovieBlast — Premium Public Domain Movies</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <div class="nav-top">
      <a href="index.html" class="logo">Diboh<span>MovieBlast</span></a>
      <div class="nav-search"><input id="searchInput" type="search" placeholder="মুভি খুঁজুন..." autocomplete="off"></div>
    </div>
    <nav class="main-nav">
      <a href="index.html">হোম</a>
      <a href="#trending">ট্রেন্ডিং</a>
      <a href="#latest">সর্বশেষ</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero" id="hero">
    <div class="hero-backdrop" id="hero-backdrop"></div>
    <div class="hero-content" id="hero-content"></div>
  </section>

  <div class="filter-section">
    <select id="genreFilter"><option value="">সব জেনার</option></select>
    <select id="langFilter"><option value="">সব ভাষা</option></select>
  </div>

  <section class="section hidden" id="searchResultsSection">
    <h2 class="section-title">🔍 সার্চ ফলাফল</h2>
    <div id="searchGrid" class="movie-grid"></div>
    <div id="noResults" class="empty-state hidden"><h2>কোনো মুভি পাওয়া যায়নি</h2></div>
  </section>

  <div id="defaultSections">
    <section class="section" id="trending">
      <h2 class="section-title">🔥 ট্রেন্ডিং মুভি</h2>
      <div id="trendingGrid" class="movie-grid"></div>
    </section>
    <section class="section" id="latest">
      <h2 class="section-title">🆕 সর্বশেষ যোগ করা</h2>
      <div id="latestGrid" class="movie-grid"></div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Use</a>
    <a href="copyright.html">Copyright Policy</a>
  </div>
  <p>© 2025 Diboh MovieBlast | শুধুমাত্র বৈধ পাবলিক ডোমেইন কন্টেন্ট।</p>
</footer>

<div class="modal hidden" id="modal">
  <div class="modal-content">
    <button class="close-btn" id="closeModal">✕</button>
    <div class="modal-body">
      <img id="modal-img" src="" alt="Poster" onerror="this.src='https://placehold.co/300x450/13131c/f5b301?text=No+Image'">
      <div class="modal-info">
        <h2 id="modal-title"></h2>
        <div class="meta-tags">
          <span id="modal-year"></span>
          <span id="modal-runtime"></span>
          <span id="modal-rating"></span>
        </div>
        <p id="modal-desc" class="synopsis"></p>
        <p class="cast"><strong>Cast:</strong> <span id="modal-cast"></span></p>
        <div class="rights-box">
          <p><strong>Source:</strong> <span id="modal-source"></span></p>
          <p><strong>Rights:</strong> <span id="modal-rights"></span></p>
          <p class="small-text"><em id="modal-evidence"></em></p>
        </div>
        <h3 class="download-title">⬇️ Download Options</h3>
        <div class="download-buttons" id="modal-downloads"></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
